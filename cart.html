<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serenah | Carrito de Compras</title>
    <!-- Estilos Bootsrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="icon" type="image/png" href="./assets/img/Favicon negro.png">
</head>

<body>
    <header>
        <section class="preHeader">
            <div class="bannerHeader">
                <p><strong>3 cuotas sin interes en toda la tienda</strong></p>
            </div>
        </section>

        <section class="header">
            <div class="logo">
                <a href="./index.html">
                    <img class="imgLogo" src="./assets/img/logo.png" alt="Serenah Logo">
                </a>
            </div>
            
            <div class="header-right">
                <a href="./cart.html" class="nav-cart-btn">
                    <i class="bi bi-cart3"></i> <span class="cart-text">Carrito</span> <span id="contador-carrito" class="badge-cart">0</span>
                </a>
                <button class="hamburger-btn" id="hamburger-toggle" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>
            </div>

            <nav class="nav-menu" id="nav-menu">
                <a href="./index.html">Inicio</a>
                <a href="./productos.html">Productos</a>
                <a href="./contacto.html">Contacto</a>
                <a href="./nosotros.html">Nosotros</a>
            </nav>
        </section>
    </header>

    <main>
        <!-- Contenedor -->
        <section class="contenedorPrincipal">
            <div class="hero">
                <h1 class="titulo tituloPrincipal">Tu Carrito de Skincare</h1>
                <p class="textoDescripcion">Aquí puedes ver y gestionar los productos seleccionados.</p>
            </div>
        </section>

        <section class="d-flex flex-column align-items-center py-5">
            <h2 class="titulo-productos">Productos Seleccionados</h2>
            <div id="contenedor-carrito" class="contenedorProductos"></div>
            <div id="acciones-carrito" class="w-100"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer Elementos">
            <p>Sitio Realizado por Jesús Trujillo para Talento Tech 2026</p>
        </div>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
    <script type="module" src="./assets/js/carrito.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
