<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serenah | Contacto</title>
    <!-- Estilos Bootsrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="icon" type="image/png" href="./assets/img/Favicon negro.png">
</head>

<body>
    <header>
        <section class="preHeader">
            <div class="bannerHeader">
                <p><strong>3 cuotas sin interes en toda la tienda</strong></p>
            </div>
        </section>

        <section class="header">
            <div class="logo">
                <a href="./index.html"> <img class="imgLogo" src="./assets/img/logo.png" alt="">LOGO</a>
            </div>
            <div class="menu">
                <nav>
                    <a href="./index.html">Inicio</a>
                    <a href="./productos.html">Productos</a>
                    <a href="./contacto.html">Contacto</a>
                    <a href="./nosotros.html">Nosotros</a>
                    <a href="./cart.html" class="nav-cart-btn"><i class="bi bi-cart3"></i> Carrito <span id="contador-carrito" class="badge-cart">0</span></a>
                </nav>
            </div>
        </section>
    </header>

    <main>
        <section class="contenedorPrincipal">
            <div class="hero">
                <h1 class="titulo tituloPrincipal">Contacto</h1>
                <p class="textoDescripcion">¿Tienes dudas o sugerencias? Escríbenos y te responderemos lo antes posible.</p>
            </div>
        </section>

        <section class="contacto-seccion d-flex flex-column align-items-center py-5">
            <div class="card p-4 shadow-lg border-0 contacto-card">
                <form id="formulario-contacto">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" required placeholder="Tu nombre">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" required placeholder="tu@correo.com">
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea class="form-control" id="mensaje" rows="4" required placeholder="Escribe tu consulta aquí..."></textarea>
                    </div>
                    <button type="submit" class="btn w-100 btn-submit-contacto">Enviar Mensaje</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer Elementos">
            <p>Sitio Realizado por Jesús Trujillo para Talento Tech 2026</p>
        </div>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById("formulario-contacto")?.addEventListener("submit", (e) => {
            e.preventDefault();
            alert("¡Mensaje enviado con éxito! Nos pondremos en contacto contigo pronto. ✉️🌸");
            e.target.reset();
        });
    </script>
</body>
</html>
